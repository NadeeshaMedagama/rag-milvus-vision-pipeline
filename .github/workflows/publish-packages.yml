name: Publish to GitHub Packages

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_docker:
        description: 'Publish Docker image to GHCR'
        required: false
        default: true
        type: boolean
      publish_python:
        description: 'Publish Python package artifact'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Publish Docker image to GHCR
  # ──────────────────────────────────────────────
  publish-docker:
    name: Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.publish_docker == 'true'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU for multi-platform builds
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix=sha-
          type=ref,event=branch
          type=raw,value=latest,enable={{is_default_branch}}
        labels: |
          org.opencontainers.image.title=RAG Milvus Vision Pipeline
          org.opencontainers.image.description=Python RAG pipeline with Milvus vector store, Google Vision API, and LangGraph orchestration
          org.opencontainers.image.vendor=${{ github.repository_owner }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.licenses=MIT

    - name: Build and push Docker image
      id: build-push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64
        provenance: true
        sbom: true

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v2
      with:
        subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        subject-digest: ${{ steps.build-push.outputs.digest }}
        push-to-registry: true

    - name: Verify published image
      run: |
        echo "## 🐳 Docker Image Published to GHCR" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Registry:** \`${{ env.REGISTRY }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Tags" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Job 2: Publish Python package to GitHub Packages
  # ──────────────────────────────────────────────
  publish-python:
    name: Publish Python Package to GitHub Packages
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.publish_python == 'true'

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools wheel twine

    - name: Get version from tag
      id: version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          VERSION="0.0.0-dev.$(echo ${GITHUB_SHA} | cut -c1-7)"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "Package version: ${VERSION}"

    - name: Create setup.py for packaging
      run: |
        cat > setup.py << 'SETUP_EOF'
        from setuptools import setup, find_packages

        setup(
            name="rag-milvus-vision-pipeline",
            version="${VERSION}",
            description="Python RAG pipeline with Milvus vector store, Google Vision API, and LangGraph orchestration",
            long_description=open("README.md").read(),
            long_description_content_type="text/markdown",
            author="${{ github.repository_owner }}",
            url="https://github.com/${{ github.repository }}",
            packages=find_packages(exclude=["tests*", "data*", "credentials*"]),
            python_requires=">=3.12",
            install_requires=[line.strip() for line in open("requirements.txt") if line.strip() and not line.startswith("#")],
            classifiers=[
                "Development Status :: 4 - Beta",
                "Intended Audience :: Developers",
                "License :: OSI Approved :: MIT License",
                "Programming Language :: Python :: 3.12",
                "Topic :: Scientific/Engineering :: Artificial Intelligence",
            ],
            entry_points={
                "console_scripts": [
                    "rag-pipeline=main:main",
                    "rag-api=api_server:app",
                ],
            },
        )
        SETUP_EOF
        # Replace version placeholder
        sed -i "s/\${VERSION}/${{ steps.version.outputs.VERSION }}/g" setup.py

    - name: Build package
      run: python -m build

    - name: Upload package as artifact
      uses: actions/upload-artifact@v7
      with:
        name: python-package-${{ steps.version.outputs.VERSION }}
        path: dist/
        retention-days: 90

    - name: Publish to GitHub Packages (PyPI)
      run: |
        twine upload \
          --repository-url https://upload.pypi.org/legacy/ \
          --skip-existing \
          dist/* || echo "⚠️ PyPI upload skipped (not configured or already exists)"
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      continue-on-error: true

    - name: Generate summary
      run: |
        echo "## 📦 Python Package Published" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** \`rag-milvus-vision-pipeline\`" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
        ls -la dist/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No dist files found" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Job 3: Post-publish verification
  # ──────────────────────────────────────────────
  verify-packages:
    name: Verify Published Packages
    needs: [publish-docker, publish-python]
    runs-on: ubuntu-latest
    if: always() && !cancelled()

    steps:
    - name: Verify Docker image is pullable
      if: needs.publish-docker.result == 'success'
      run: |
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo ${GITHUB_SHA} | cut -c1-7) || \
        docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest || \
        echo "⚠️ Image pull verification skipped"

    - name: Download Python package artifact
      if: needs.publish-python.result == 'success'
      uses: actions/download-artifact@v4
      with:
        pattern: python-package-*
        path: ./packages/

    - name: Publish summary
      run: |
        echo "## 📋 Package Publishing Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Package | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🐳 Docker (GHCR) | ${{ needs.publish-docker.result == 'success' && '✅ Published' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🐍 Python Package | ${{ needs.publish-python.result == 'success' && '✅ Published' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔗 Quick Access" >> $GITHUB_STEP_SUMMARY
        echo "- **GHCR:** \`docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Packages:** [View all packages](https://github.com/${{ github.repository }}/packages)" >> $GITHUB_STEP_SUMMARY

