name: Release Management

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version
      id: get_version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Generate changelog
      id: changelog
      uses: mikepenz/release-changelog-builder-action@v4
      with:
        configuration: |
          {
            "categories": [
              {
                "title": "## 🚀 Features",
                "labels": ["feature", "enhancement"]
              },
              {
                "title": "## 🐛 Bug Fixes",
                "labels": ["bug", "fix"]
              },
              {
                "title": "## 📚 Documentation",
                "labels": ["documentation", "docs"]
              },
              {
                "title": "## 🔒 Security",
                "labels": ["security"]
              },
              {
                "title": "## 🧰 Maintenance",
                "labels": ["maintenance", "chore", "dependencies"]
              }
            ],
            "template": "#{{CHANGELOG}}\n\n**Full Changelog**: #{{RELEASE_DIFF}}"
          }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create distribution packages
      run: |
        mkdir -p dist
        tar -czf dist/python-rag-milvus-${{ steps.get_version.outputs.VERSION }}.tar.gz \
          --exclude='.git' \
          --exclude='.venv' \
          --exclude='__pycache__' \
          --exclude='*.pyc' \
          --exclude='data' \
          --exclude='credentials' \
          .

    - name: Generate release notes
      id: release_notes
      run: |
        cat > release_notes.md << 'EOF'
        # Python RAG with Milvus - ${{ steps.get_version.outputs.VERSION }}
        
        ## What's Changed
        ${{ steps.changelog.outputs.changelog }}
        
        ## 📦 Installation
        
        ### Using Docker (Recommended)
        ```bash
        docker pull ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
        docker run -p 5000:5000 ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}
        ```
        
        ### From Source
        ```bash
        # Download and extract
        wget https://github.com/${{ github.repository }}/archive/${{ steps.get_version.outputs.VERSION }}.tar.gz
        tar -xzf ${{ steps.get_version.outputs.VERSION }}.tar.gz
        cd python-rag-milvus-*
        
        # Install dependencies
        pip install -r requirements.txt
        
        # Configure .env file
        cp .env.example .env
        # Edit .env with your credentials
        
        # Run the application
        python main.py
        ```
        
        ## 🔗 Resources
        
        - [Documentation](https://github.com/${{ github.repository }}/blob/${{ steps.get_version.outputs.VERSION }}/README.md)
        - [Docker Image](https://ghcr.io/${{ github.repository }})
        - [Report Issues](https://github.com/${{ github.repository }}/issues)
        
        ## 📊 Artifacts
        
        - Docker images available for `linux/amd64` and `linux/arm64`
        - Source code archive attached below
        - SBOM (Software Bill of Materials) available in artifacts
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.VERSION }}
        name: Release ${{ steps.get_version.outputs.VERSION }}
        body_path: release_notes.md
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.VERSION, '-') }}
        files: |
          dist/*
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Summary
      run: |
        echo "## Release Created Successfully! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.get_version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Docker Image:** \`ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY

  notify-release:
    name: Post-Release Notifications
    needs: create-release
    runs-on: ubuntu-latest
    if: success()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create release summary
      run: |
        echo "Release workflow completed successfully!"
        echo "Version: ${{ github.ref_name }}"

