name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  DOCKER_IMAGE_NAME: python-rag-milvus

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black isort mypy pylint bandit safety

    - name: Code formatting check with Black
      run: black --check --diff .
      continue-on-error: true

    - name: Import sorting check with isort
      run: isort --check-only --diff .
      continue-on-error: true

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Lint with pylint
      run: pylint **/*.py --exit-zero
      continue-on-error: true

    - name: Type checking with mypy
      run: mypy . --ignore-missing-imports --exclude __pycache__ --exclude .venv
      continue-on-error: true

    - name: Security check with bandit
      run: bandit -r . -f json -o bandit-report.json || true
      continue-on-error: true

    - name: Upload bandit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: bandit-report.json
        retention-days: 30

    - name: Check dependencies for vulnerabilities
      run: |
        pip install safety
        safety check --json --output safety-report.json || true
      continue-on-error: true

    - name: Upload safety report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: safety-vulnerability-report
        path: safety-report.json
        retention-days: 30

    - name: Run tests with pytest
      run: |
        pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term
      continue-on-error: true

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/
        retention-days: 30

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

  docker-build-test:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: ${{ env.DOCKER_IMAGE_NAME }}:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: true

    - name: Test Docker image
      run: |
        docker images
        docker run --name test-container -d -p 5000:5000 \
          -e AZURE_OPENAI_API_KEY=test \
          -e AZURE_OPENAI_ENDPOINT=https://test.openai.azure.com/ \
          -e MILVUS_URI=http://test:19530 \
          -e MILVUS_TOKEN=test \
          ${{ env.DOCKER_IMAGE_NAME }}:test
        
        # Wait for container to start
        sleep 10
        
        # Check if container is running
        docker ps -a
        
        # Check container logs
        docker logs test-container
        
        # Test health endpoint (may fail if dependencies are not available)
        curl -f http://localhost:5000/health || echo "Health check failed (expected in test environment)"
        
        # Clean up
        docker stop test-container
        docker rm test-container

    - name: Scan Docker image for vulnerabilities with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE_NAME }}:test
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
      continue-on-error: true

    - name: Upload Trivy results to GitHub Security
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    - name: Generate Trivy JSON report
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.DOCKER_IMAGE_NAME }}:test
        format: 'json'
        output: 'trivy-report.json'
      continue-on-error: true

    - name: Upload Trivy report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-vulnerability-report
        path: trivy-report.json
        retention-days: 30

  build-status:
    name: CI Build Status
    runs-on: ubuntu-latest
    needs: [lint-and-test, docker-build-test]
    if: always()

    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.lint-and-test.result }}" != "success" ] || [ "${{ needs.docker-build-test.result }}" != "success" ]; then
          echo "Build failed or was cancelled"
          exit 1
        fi
        echo "All checks passed successfully!"

