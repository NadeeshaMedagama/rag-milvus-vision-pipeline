name: GitHub Marketplace Action Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — validate only, do not publish'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: read

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Validate the action.yml
  # ──────────────────────────────────────────────
  validate-action:
    name: Validate Action Definition
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Verify action.yml exists
      run: |
        if [ ! -f "action.yml" ]; then
          echo "❌ action.yml not found in repository root!"
          exit 1
        fi
        echo "✅ action.yml found"

    - name: Validate action.yml syntax
      run: |
        pip install pyyaml
        python - << 'PYEOF'
        import yaml
        import sys

        with open('action.yml', 'r') as f:
            try:
                action = yaml.safe_load(f)
            except yaml.YAMLError as e:
                print(f"❌ Invalid YAML syntax: {e}")
                sys.exit(1)

        # Required top-level fields for marketplace
        required_fields = ['name', 'description', 'runs']
        missing = [f for f in required_fields if f not in action]
        if missing:
            print(f"❌ Missing required fields: {missing}")
            sys.exit(1)

        # Validate branding (required for marketplace)
        if 'branding' not in action:
            print("⚠️  Warning: 'branding' section missing (required for Marketplace)")
        else:
            branding = action['branding']
            valid_icons = [
                'activity', 'airplay', 'alert-circle', 'alert-octagon', 'alert-triangle',
                'align-center', 'align-justify', 'align-left', 'align-right', 'anchor',
                'aperture', 'archive', 'arrow-down-circle', 'arrow-down-left', 'arrow-down-right',
                'arrow-down', 'arrow-left-circle', 'arrow-left', 'arrow-right-circle',
                'arrow-right', 'arrow-up-circle', 'arrow-up-left', 'arrow-up-right', 'arrow-up',
                'at-sign', 'award', 'bar-chart-2', 'bar-chart', 'battery-charging', 'battery',
                'bell-off', 'bell', 'bluetooth', 'bold', 'book-open', 'book', 'bookmark',
                'box', 'briefcase', 'calendar', 'camera-off', 'camera', 'cast', 'check-circle',
                'check-square', 'check', 'chevron-down', 'chevron-left', 'chevron-right',
                'chevron-up', 'chevrons-down', 'chevrons-left', 'chevrons-right', 'chevrons-up',
                'circle', 'clipboard', 'clock', 'cloud-drizzle', 'cloud-lightning', 'cloud-off',
                'cloud-rain', 'cloud-snow', 'cloud', 'code', 'command', 'compass', 'copy',
                'corner-down-left', 'corner-down-right', 'corner-left-down', 'corner-left-up',
                'corner-right-down', 'corner-right-up', 'corner-up-left', 'corner-up-right',
                'cpu', 'credit-card', 'crop', 'crosshair', 'database', 'delete', 'disc',
                'dollar-sign', 'download-cloud', 'download', 'droplet', 'edit-2', 'edit-3',
                'edit', 'external-link', 'eye-off', 'eye', 'fast-forward', 'feather',
                'file-minus', 'file-plus', 'file-text', 'file', 'film', 'filter', 'flag',
                'folder-minus', 'folder-plus', 'folder', 'gift', 'git-branch', 'git-commit',
                'git-merge', 'git-pull-request', 'globe', 'grid', 'hard-drive', 'hash',
                'headphones', 'heart', 'help-circle', 'home', 'image', 'inbox', 'info',
                'italic', 'layers', 'layout', 'life-buoy', 'link-2', 'link', 'list',
                'loader', 'lock', 'log-in', 'log-out', 'mail', 'map-pin', 'map', 'maximize-2',
                'maximize', 'menu', 'message-circle', 'message-square', 'mic-off', 'mic',
                'minimize-2', 'minimize', 'minus-circle', 'minus-square', 'minus', 'monitor',
                'moon', 'more-horizontal', 'more-vertical', 'move', 'music', 'navigation-2',
                'navigation', 'octagon', 'package', 'paperclip', 'pause-circle', 'pause',
                'percent', 'phone-call', 'phone-forwarded', 'phone-incoming', 'phone-missed',
                'phone-off', 'phone-outgoing', 'phone', 'pie-chart', 'play-circle', 'play',
                'plus-circle', 'plus-square', 'plus', 'pocket', 'power', 'printer',
                'radio', 'refresh-ccw', 'refresh-cw', 'repeat', 'rewind', 'rotate-ccw',
                'rotate-cw', 'rss', 'save', 'scissors', 'search', 'send', 'server',
                'settings', 'share-2', 'share', 'shield-off', 'shield', 'shopping-bag',
                'shopping-cart', 'shuffle', 'sidebar', 'skip-back', 'skip-forward', 'slash',
                'sliders', 'smartphone', 'speaker', 'square', 'star', 'stop-circle', 'sun',
                'sunrise', 'sunset', 'tablet', 'tag', 'target', 'terminal', 'thermometer',
                'thumbs-down', 'thumbs-up', 'toggle-left', 'toggle-right', 'trash-2', 'trash',
                'trending-down', 'trending-up', 'triangle', 'truck', 'tv', 'type', 'umbrella',
                'underline', 'unlock', 'upload-cloud', 'upload', 'user-check', 'user-minus',
                'user-plus', 'user-x', 'user', 'users', 'video-off', 'video', 'voicemail',
                'volume-1', 'volume-2', 'volume-x', 'volume', 'watch', 'wifi-off', 'wifi',
                'wind', 'x-circle', 'x-square', 'x', 'zap-off', 'zap', 'zoom-in', 'zoom-out'
            ]
            valid_colors = ['white', 'yellow', 'blue', 'green', 'orange', 'red', 'purple', 'gray-dark']

            icon = branding.get('icon', '')
            color = branding.get('color', '')

            if icon not in valid_icons:
                print(f"⚠️  Warning: icon '{icon}' may not be valid for Marketplace")
            if color not in valid_colors:
                print(f"⚠️  Warning: color '{color}' may not be valid for Marketplace")

        # Validate inputs
        if 'inputs' in action:
            for name, config in action['inputs'].items():
                if 'description' not in config:
                    print(f"⚠️  Warning: input '{name}' missing description")

        # Validate outputs
        if 'outputs' in action:
            for name, config in action['outputs'].items():
                if 'description' not in config:
                    print(f"⚠️  Warning: output '{name}' missing description")

        # Validate runs
        runs = action['runs']
        if 'using' not in runs:
            print("❌ 'runs.using' is required")
            sys.exit(1)

        print("✅ action.yml validation passed!")
        print(f"   Name: {action['name']}")
        print(f"   Description: {action['description'][:80]}...")
        print(f"   Type: {runs['using']}")
        if 'inputs' in action:
            print(f"   Inputs: {len(action['inputs'])}")
        if 'outputs' in action:
            print(f"   Outputs: {len(action['outputs'])}")
        PYEOF

    - name: Validate required files exist
      run: |
        echo "Checking required files for marketplace..."
        
        files_ok=true
        
        for file in README.md requirements.txt Dockerfile; do
          if [ -f "$file" ]; then
            echo "  ✅ $file"
          else
            echo "  ⚠️  $file not found (recommended)"
          fi
        done
        
        # Check action.yml has branding
        if grep -q "branding:" action.yml; then
          echo "  ✅ branding section present"
        else
          echo "  ❌ branding section missing (required for Marketplace)"
          files_ok=false
        fi
        
        if [ "$files_ok" = false ]; then
          echo ""
          echo "❌ Some required checks failed"
          exit 1
        fi

    - name: Validation summary
      run: |
        echo "## ✅ Action Validation Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The \`action.yml\` is valid and ready for GitHub Marketplace." >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Job 2: Test the action works end-to-end
  # ──────────────────────────────────────────────
  test-action:
    name: Test Action (Dry Run)
    needs: validate-action
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Python imports
      run: |
        python -c "
        print('Testing imports...')
        from config import get_settings
        print('  ✅ config')
        from services import AzureOpenAIEmbeddingService, MilvusVectorStore
        print('  ✅ services')
        from models import DocumentChunk, EmbeddingResult
        print('  ✅ models')
        from workflows import RAGWorkflow
        print('  ✅ workflows')
        print('All imports successful!')
        " || echo "⚠️ Some imports failed (expected without .env)"

    - name: Test summary
      run: |
        echo "## 🧪 Action Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Dependencies install successfully" >> $GITHUB_STEP_SUMMARY
        echo "✅ Python module imports verified" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Job 3: Publish / Tag for Marketplace
  # ──────────────────────────────────────────────
  publish-marketplace:
    name: Publish to GitHub Marketplace
    needs: [validate-action, test-action]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Get version info
      id: version
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        
        MAJOR=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f1)
        MINOR=$(echo "$VERSION" | sed 's/^v//' | cut -d. -f2)
        
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "major=v${MAJOR}" >> $GITHUB_OUTPUT
        echo "minor=v${MAJOR}.${MINOR}" >> $GITHUB_OUTPUT
        
        echo "Version: ${VERSION}"
        echo "Major tag: v${MAJOR}"
        echo "Minor tag: v${MAJOR}.${MINOR}"

    - name: Update major version tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # Update major version tag (e.g., v1)
        git tag -fa ${{ steps.version.outputs.major }} -m "Update ${{ steps.version.outputs.major }} tag to ${{ steps.version.outputs.version }}"
        git push origin ${{ steps.version.outputs.major }} --force
        
        # Update minor version tag (e.g., v1.0)
        git tag -fa ${{ steps.version.outputs.minor }} -m "Update ${{ steps.version.outputs.minor }} tag to ${{ steps.version.outputs.version }}"
        git push origin ${{ steps.version.outputs.minor }} --force
        
        echo "✅ Updated floating tags:"
        echo "  ${{ steps.version.outputs.major }} → ${{ steps.version.outputs.version }}"
        echo "  ${{ steps.version.outputs.minor }} → ${{ steps.version.outputs.version }}"

    - name: Verify release exists
      if: github.event_name != 'release'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Check if a release already exists for this tag
        if gh release view "${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
          echo "✅ Release already exists for ${{ steps.version.outputs.version }}"
        else
          echo "⚠️  No release found for ${{ steps.version.outputs.version }}"
          echo "    Create a release from this tag to publish to GitHub Marketplace."
          echo "    Go to: https://github.com/${{ github.repository }}/releases/new?tag=${{ steps.version.outputs.version }}"
        fi

    - name: Marketplace publishing summary
      run: |
        echo "## 🏪 GitHub Marketplace Action Release" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Action:** RAG Milvus Vision Pipeline" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Version Tags Updated" >> $GITHUB_STEP_SUMMARY
        echo "| Tag | Points To |" >> $GITHUB_STEP_SUMMARY
        echo "|-----|-----------|" >> $GITHUB_STEP_SUMMARY
        echo "| \`${{ steps.version.outputs.version }}\` | This release |" >> $GITHUB_STEP_SUMMARY
        echo "| \`${{ steps.version.outputs.minor }}\` | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
        echo "| \`${{ steps.version.outputs.major }}\` | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Usage Example" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
        echo "- name: Run RAG Pipeline" >> $GITHUB_STEP_SUMMARY
        echo "  uses: ${{ github.repository }}@${{ steps.version.outputs.major }}" >> $GITHUB_STEP_SUMMARY
        echo "  with:" >> $GITHUB_STEP_SUMMARY
        echo "    milvus-uri: \${{ secrets.MILVUS_URI }}" >> $GITHUB_STEP_SUMMARY
        echo "    milvus-token: \${{ secrets.MILVUS_TOKEN }}" >> $GITHUB_STEP_SUMMARY
        echo "    azure-openai-api-key: \${{ secrets.AZURE_OPENAI_API_KEY }}" >> $GITHUB_STEP_SUMMARY
        echo "    azure-openai-endpoint: \${{ secrets.AZURE_OPENAI_ENDPOINT }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📝 Marketplace Publishing Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. ✅ action.yml validated" >> $GITHUB_STEP_SUMMARY
        echo "2. ✅ Action tested" >> $GITHUB_STEP_SUMMARY
        echo "3. ✅ Version tags updated" >> $GITHUB_STEP_SUMMARY
        echo "4. 🔗 [Publish to Marketplace](https://github.com/${{ github.repository }}/releases) — edit the release and check **Publish this Action to the GitHub Marketplace**" >> $GITHUB_STEP_SUMMARY

